<!DOCTYPE html>
<html>
    <head>
        <title>
            GET & POST Request
        </title>
    </head>

    <body>
        <h3>GET request form</h3>
        <form method="GET" action="http://localhost:8080/register">
            <input placeholder="Enter name" type="text" name="user">
            <input placeholder="Enter Password" type="password" name="pass">
            <button>submit</button>
        </form>

        <hr>
        <h3>POST request form</h3>
        <form method="POST" action="http://localhost:8080/register">
            <input placeholder="Enter name" type="text" name="user">
            <input placeholder="Enter Password" type="password" name="pass">
            <button>SUBMIT</button>
        </form>
    </body>
</html>
