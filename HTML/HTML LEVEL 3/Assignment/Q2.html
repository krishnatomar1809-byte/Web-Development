<!DOCTYPE html>
<html>
    <head>
        <title>Q2</title>
    </head>
    <body>
        <form action="/action">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <br>
            <div>
                Sex:
                <input type="radio" name="sex" value="m" id="male">
                <label for="male">Male</label>
                <input type="radio" name="sex" value="f" id="female">
                <label for="female">Female</label>
            </div>
            <br>
            <div>
                Country:
                <select name="country" id="country">
                    <option value="ind">India</option>
                    <option value="Nepal">Nepal</option>
                    <option value="USA">USA</option>
                    <option value="Can">Canada</option>
                </select>
            </div>
            <br>
            <div>
                Message:<br>
                <textarea id="mess" name="mess" rows="5" cols="50"></textarea>
            </div>
            <br>
            <div>
                <input type="checkbox" id="checkbox" name="sub">
                <label for="checkbox">Subscribe?</label>
            </div>
            <br>
            <button>Submit</button>

        </form>
    </body>
</html>
