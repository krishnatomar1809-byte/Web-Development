<!DOCTYPE html>
<html>
    <head>
        <title>Q3</title>
    </head>
    <body>
        <form action="/action">
            <h2>Feedback Form</h2>
            <br>
            <div>
                <label for="name">Name:</label>
                <input type="text" placeholder="Write your name" name="name" id="name">
                <br>
                <br>
                <label for="email">Email:</label>
                <input type="email" placeholder="Write your email" name="email" id="email">
            </div>
            <br>
            <div>
                <label for="mess">Message:</label><br>
                <textarea name="mess" id="mess" rows="5" cols="40"></textarea>
            </div>
            <br>
            <div>
                Rate us our of 5:<br>
                <input type="radio" name="rate" value="1" id="1">
                <label for="1">1</label> <br>
                <input type="radio" name="rate" value="2" id="2">
                <label for="2">2</label> <br>
                <input type="radio" name="rate" value="3" id="3">
                <label for="3">3</label> <br>
                <input type="radio" name="rate" value="4" id="4">
                <label for="4">4</label> <br>
                <input type="radio" name="rate" value="5" id="5">
                <label for="5">5</label> <br>
            </div>
            <br>
            <br>
            <button>Send your message!</button>
        </form>
    </body>
</html>
